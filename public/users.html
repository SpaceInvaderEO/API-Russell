<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russell Marina | Utilisateurs</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav">
        <div class="container" style="display: flex; justify-content: space-between; width: 100%;">
            <a href="dashboard.html" class="logo">⚓ Russell Marina</a>
            <button id="logoutBtn" class="btn btn-primary" style="padding: 0.5rem 1rem; width: auto; font-size: 0.75rem;">Déconnexion</button>
        </div>
    </nav>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="navbar-links" style="flex-direction: column;">
                <a href="dashboard.html" class="nav-link">Tableau de bord</a>
                <a href="catways.html" class="nav-link">Gestion des Catways</a>
                <a href="reservations.html" class="nav-link">Réservations</a>
                <a href="users.html" class="nav-link" style="color: var(--primary);">Utilisateurs</a>
            </div>
        </aside>

        <main class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2>Gestion des Utilisateurs</h2>
                <button onclick="showModal()" class="btn btn-primary" style="width: auto;">+ Nouvel Utilisateur</button>
            </div>

            <div class="table-container">
                <table id="userTable">
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div class="card" style="max-width: 500px;">
            <h3 id="modalTitle">Ajouter un Utilisateur</h3>
            <form id="userForm" style="margin-top: 1.5rem;">
                <div class="form-group">
                    <label>Nom d'utilisateur</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password">
                    <small id="pwHint" style="display:none; font-size: 0.75rem; color: var(--secondary);">Laisser vide pour ne pas modifier</small>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" onclick="hideModal()" class="btn" style="background:#e2e8f0;">Annuler</button>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'index.html';

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        });

        async function fetchUsers() {
            const res = await fetch('/users', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            const tbody = document.querySelector('#userTable tbody');
            tbody.innerHTML = data.map(u => `
                <tr>
                    <td>${u.username}</td>
                    <td>${u.email}</td>
                    <td>
                        <button onclick="editUser('${u.username}', '${u.email}')" style="background:none; border:none; color:var(--primary); cursor:pointer; font-weight:600; margin-right:1rem;">Éditer</button>
                        <button onclick="deleteUser('${u.email}')" style="background:none; border:none; color:var(--danger); cursor:pointer; font-weight:600;">Supprimer</button>
                    </td>
                </tr>
            `).join('');
        }

        function showModal() {
            document.getElementById('userForm').reset();
            document.getElementById('email').disabled = false;
            document.getElementById('password').required = true;
            document.getElementById('pwHint').style.display = 'none';
            document.getElementById('modalTitle').textContent = 'Ajouter un Utilisateur';
            document.getElementById('modal').style.display = 'flex';
        }

        function hideModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function editUser(name, email) {
            document.getElementById('username').value = name;
            document.getElementById('email').value = email;
            document.getElementById('email').disabled = true;
            document.getElementById('password').required = false;
            document.getElementById('pwHint').style.display = 'block';
            document.getElementById('modalTitle').textContent = 'Modifier l\'utilisateur';
            document.getElementById('modal').style.display = 'flex';
        }

        async function deleteUser(email) {
            if (confirm('Supprimer cet utilisateur ?')) {
                await fetch('/users/' + email, { 
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                fetchUsers();
            }
        }

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const isEdit = document.getElementById('email').disabled;
            
            const body = {
                username: document.getElementById('username').value,
                email: email
            };
            const pw = document.getElementById('password').value;
            if (pw) body.password = pw;

            const url = isEdit ? '/users/' + email : '/users';
            const method = isEdit ? 'PUT' : 'POST';

            await fetch(url, {
                method: method,
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(body)
            });

            hideModal();
            fetchUsers();
        });

        fetchUsers();
    </script>
</body>
</html>
